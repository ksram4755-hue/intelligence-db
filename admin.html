<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - ADMIN PANEL</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0f1d;
  --card: #152033;
  --border: #23334d;
  --accent: #3b82f6;
  --gold: #d97706;
  --red: #dc2626;
  --green: #059669;
  --text: #f8fafc;
  --dim: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.login-screen {
  position: fixed; inset: 0;
  background: radial-gradient(circle at center, #152033 0%, #050a15 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 100;
}
.login-screen.hidden { display: none; }
.login-box {
  background: var(--card); border: 1px solid var(--border);
  border-top: 4px solid var(--accent); border-radius: 12px;
  padding: 36px 30px; max-width: 400px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.login-box h1 { text-align: center; color: var(--accent); font-size: 1.3rem; margin-bottom: 6px; }
.login-box .sub { text-align: center; color: var(--dim); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; margin-bottom: 24px; }
.login-icon {
  width: 70px; height: 70px; margin: 0 auto 20px;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 2rem; box-shadow: 0 0 30px rgba(59,130,246,0.5);
}
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.8rem; color: var(--dim); font-weight: 700; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 11px 14px; color: #fff;
  font-family: inherit; font-size: 0.9rem;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}
.field textarea { resize: vertical; min-height: 70px; }
.btn {
  width: 100%; padding: 13px; background: var(--accent); color: #fff;
  border: none; border-radius: 8px; font-family: inherit;
  font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: all 0.2s;
}
.btn:hover { background: #2563eb; transform: translateY(-1px); }
.btn-red { background: var(--red); }
.btn-red:hover { background: #b91c1c; }
.btn-green { background: var(--green); }
.btn-green:hover { background: #047857; }
.btn-gray { background: var(--border); }
.btn-gray:hover { background: #334155; }
.error-msg {
  background: rgba(220,38,38,0.15); border: 1px solid var(--red);
  color: #fca5a5; padding: 10px; border-radius: 6px;
  font-size: 0.85rem; margin-top: 12px; display: none;
}
.admin-panel { display: none; }
.admin-panel.active { display: block; }
.topbar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 10px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { display: flex; align-items: center; gap: 12px; font-weight: 800; color: #fff; font-size: 1rem; }
.topbar-title .dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; box-shadow: 0 0 10px var(--green); }
.topbar-user { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--dim); }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
.stat-value { font-size: 1.5rem; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono', monospace; }
.stat-label { font-size: 0.72rem; color: var(--dim); font-weight: 700; }
.actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.actions .btn { width: auto; padding: 11px 20px; font-size: 0.88rem; }
.search-bar {
  width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px; color: #fff;
  font-family: inherit; margin-bottom: 20px; font-size: 0.9rem;
}
.search-bar:focus { outline: none; border-color: var(--accent); }
.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { background: var(--bg); color: var(--dim); text-align: right; padding: 12px 14px; font-weight: 800; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: #fff; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(59,130,246,0.05); }
.row-actions { display: flex; gap: 6px; }
.btn-mini { padding: 5px 10px; border-radius: 5px; border: 1px solid; background: transparent; cursor: pointer; font-family: inherit; font-size: 0.75rem; font-weight: 700; transition: all 0.2s; }
.btn-edit { color: var(--accent); border-color: var(--accent); }
.btn-edit:hover { background: var(--accent); color: #fff; }
.btn-del { color: var(--red); border-color: var(--red); }
.btn-del:hover { background: var(--red); color: #fff; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  backdrop-filter: blur(6px); z-index: 200; display: none;
  align-items: flex-start; justify-content: center;
  padding: 20px; overflow-y: auto;
}
.modal-overlay.active { display: flex; }
.modal { background: var(--card); border: 1px solid var(--accent); border-top: 4px solid var(--accent); border-radius: 12px; max-width: 720px; width: 100%; margin: 20px 0; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--card); z-index: 2; border-radius: 12px 12px 0 0; }
.modal-header h2 { font-size: 1.1rem; color: #fff; }
.close-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
.close-btn:hover { background: var(--red); border-color: var(--red); }
.modal-body { padding: 20px; }
.form-section { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
.form-section h3 { color: var(--accent); font-size: 0.9rem; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
.form-row:last-child { margin-bottom: 0; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--green); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 700; z-index: 9999; display: none; }
.toast.error { border-color: var(--red); }
.empty-row { text-align: center; padding: 40px; color: var(--dim); }
@media (max-width: 700px) {
  table { font-size: 0.78rem; }
  th, td { padding: 8px 10px; }
  .stat-value { font-size: 1.2rem; }
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h1>لوحة التحكم</h1>
    <div class="sub">ADMIN ACCESS ONLY</div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">🔓 تسجيل الدخول</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<div class="admin-panel" id="adminPanel">
  <div class="topbar">
    <div class="topbar-title">
      <span class="dot"></span>
      <span>🛡️ لوحة تحكم قاعدة البيانات</span>
    </div>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <span class="topbar-user" id="userEmail"></span>
      <button class="btn btn-red" style="width:auto; padding:8px 16px; font-size:0.82rem;" id="logoutBtn">خروج</button>
    </div>
  </div>

  <div class="container">
    <div class="stats" id="stats"></div>

    <div class="actions">
      <button class="btn btn-green" id="addBtn">➕ إضافة شخص جديد</button>
      <button class="btn btn-gray" id="refreshBtn">🔄 تحديث القائمة</button>
    </div>

    <input type="text" class="search-bar" id="adminSearch" placeholder="🔍 ابحث عن شخص بالاسم أو الكود...">

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الكود</th>
            <th>الاسم</th>
            <th>الفئة</th>
            <th>الحالة</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="formTitle">➕ إضافة شخص جديد</h2>
      <button class="close-btn" id="closeFormBtn">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">

      <div class="form-section">
        <h3>📋 البيانات الأساسية</h3>
        <div class="form-row">
          <div class="field">
            <label>الكود (اتركه فارغ للتوليد التلقائي)</label>
            <input type="text" id="f_code" placeholder="SUBJ-001">
          </div>
          <div class="field">
            <label>الفئة</label>
            <select id="f_category">
              <option value="target">🎯 هدف مركزي</option>
              <option value="ally">🤝 حليف</option>
              <option value="adversary">⚠️ خصم</option>
              <option value="family">👨‍👩‍👧 عائلة</option>
              <option value="telegram">💬 تيليجرام</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>الاسم</label>
            <input type="text" id="f_name" placeholder="اسم كودي أو لقب">
          </div>
          <div class="field">
            <label>الاسم بالعربي</label>
            <input type="text" id="f_name_ar" placeholder="الاسم بالعربي">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>الحالة</label>
            <select id="f_status">
              <option value="safe">🟢 آمن</option>
              <option value="watch">🟡 تحت المراقبة</option>
              <option value="danger">🔴 خطر</option>
              <option value="missing">⚫ مفقود</option>
            </select>
          </div>
          <div class="field">
            <label>مستوى التهديد</label>
            <input type="text" id="f_threat_level" placeholder="منخفض / متوسط / مرتفع / حرج">
          </div>
        </div>
        <div class="field">
          <label>الدور / الصفة</label>
          <input type="text" id="f_role" placeholder="الدور أو الصفة">
        </div>
      </div>

      <div class="form-section">
        <h3>👤 البيانات الشخصية</h3>
        <div class="form-row">
          <div class="field"><label>السن</label><input type="number" id="f_age" placeholder="30"></div>
          <div class="field"><label>تاريخ الميلاد</label><input type="text" id="f_dob" placeholder="1994-01-01"></div>
          <div class="field"><label>مكان الميلاد</label><input type="text" id="f_birthplace" placeholder="المدينة، الدولة"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>الجنسية</label><input type="text" id="f_nationality" placeholder="مصر / أمريكا"></div>
          <div class="field"><label>التعليم</label><input type="text" id="f_education" placeholder="المؤهل"></div>
          <div class="field"><label>الحالة الاجتماعية</label><input type="text" id="f_marital" placeholder="أعزب / متزوج"></div>
        </div>
      </div>

      <div class="form-section">
        <h3>📸 الصورة</h3>
        <div class="field">
          <label>رابط الصورة (من imgbb.com)</label>
          <input type="text" id="f_image" placeholder="https://i.ibb.co/...">
        </div>
      </div>

      <div class="form-section">
        <h3>📞 الاتصالات</h3>
        <div class="form-row">
          <div class="field"><label>رقم الهاتف</label><input type="text" id="f_phone" placeholder="+20 XXX XXX XXXX"></div>
          <div class="field"><label>المشغل</label><input type="text" id="f_carrier" placeholder="Vodafone / AT&T"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>تيليجرام ID</label><input type="text" id="f_telegram_id" placeholder="123456789"></div>
          <div class="field"><label>يوزر تيليجرام</label><input type="text" id="f_telegram_user" placeholder="@username"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>البريد الإلكتروني</label><input type="email" id="f_email" placeholder="test@example.com"></div>
          <div class="field"><label>X / Twitter</label><input type="text" id="f_twitter" placeholder="@username"></div>
        </div>
      </div>

      <div class="form-section">
        <h3>📍 السجل الجغرافي</h3>
        <div class="field">
          <label>العناوين (كل عنوان في سطر)</label>
          <textarea id="f_addresses" placeholder="العنوان الأول&#10;العنوان الثاني"></textarea>
        </div>
      </div>

      <div class="form-section">
        <h3>🧠 التحليل الاستخباري</h3>
        <div class="field"><label>تحليل الشخصية</label><textarea id="f_psycho_analysis" placeholder="وصف الشخصية..."></textarea></div>
        <div class="field"><label>النمط السلوكي</label><textarea id="f_behavior_pattern" placeholder="السلوك المعتاد..."></textarea></div>
        <div class="form-row">
          <div class="field"><label>نقاط الضعف</label><textarea id="f_weaknesses" placeholder="نقاط الضعف..."></textarea></div>
          <div class="field"><label>نقاط القوة</label><textarea id="f_strengths" placeholder="نقاط القوة..."></textarea></div>
        </div>
      </div>

      <div class="form-section">
        <h3>📝 ملاحظات</h3>
        <div class="field"><label>ملاحظات عامة</label><textarea id="f_notes" placeholder="ملاحظات..."></textarea></div>
      </div>

      <div class="form-section" style="border-color:var(--red);">
        <h3 style="color:var(--red);">🔒 البيانات السرية</h3>
        <div class="field"><label>ملاحظات سرية</label><textarea id="f_secret_notes" placeholder="ملاحظات لا تظهر إلا بكلمة السر..."></textarea></div>
        <div class="field"><label>تقارير سرية</label><textarea id="f_secret_reports" placeholder="تقارير حساسة..."></textarea></div>
        <div class="field"><label>تسريبات وأدلة</label><textarea id="f_secret_leaks" placeholder="تسريبات، كلمات مرور، أدلة..."></textarea></div>
      </div>

      <button class="btn btn-green" id="saveBtn" style="margin-top:10px;">💾 حفظ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓ تم بنجاح</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDM0kNaNhlmqWuzgl8S6ZEKYsIygPblEB0",
  authDomain: "intelligence-db.firebaseapp.com",
  projectId: "intelligence-db",
  storageBucket: "intelligence-db.firebasestorage.app",
  messagingSenderId: "522063872850",
  appId: "1:522063872850:web:aea535752f5838a46db08b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let allPersons = [];
let toastTimer = null;
const $ = id => document.getElementById(id);
function value(id) { return $(id)?.value?.trim() || ""; }
function setValue(id, val = "") { const el = $(id); if (el) el.value = val ?? ""; }

function escapeHTML(v) {
  return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function normalize(v) { return String(v ?? "").toLowerCase().trim(); }
function validEmail(e) { return !e || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function validURL(u) { if (!u) return true; try { const x = new URL(u); return x.protocol === "http:" || x.protocol === "https:"; } catch { return false; } }
function validAge(a) { if (!a) return true; const n = Number(a); return Number.isInteger(n) && n >= 0 && n <= 120; }

function toast(msg, isError = false) {
  const t = $("toast"); if (!t) return;
  clearTimeout(toastTimer);
  t.textContent = msg;
  t.classList.toggle("error", isError);
  t.style.display = "block";
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 3000);
}

onAuthStateChanged(auth, async user => {
  if (user) {
    $("loginScreen")?.classList.add("hidden");
    $("adminPanel")?.classList.add("active");
    if ($("userEmail")) $("userEmail").textContent = user.email || "";
    await loadPersons();
  } else {
    $("loginScreen")?.classList.remove("hidden");
    $("adminPanel")?.classList.remove("active");
    allPersons = [];
    renderStats();
    renderTable();
  }
});

async function doLogin() {
  const email = value("loginEmail");
  const pass = $("loginPass")?.value || "";
  const errBox = $("loginError");
  if (errBox) { errBox.style.display = "none"; errBox.textContent = ""; }
  if (!email || !pass) {
    if (errBox) { errBox.textContent = "⚠️ املأ البريد الإلكتروني وكلمة المرور"; errBox.style.display = "block"; }
    return;
  }
  if (!validEmail(email)) {
    if (errBox) { errBox.textContent = "⚠️ البريد الإلكتروني غير صحيح"; errBox.style.display = "block"; }
    return;
  }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (error) {
    console.error("Login error:", error);
    let message = "❌ حدث خطأ أثناء تسجيل الدخول";
    switch (error.code) {
      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found":
        message = "⚠️ البريد الإلكتروني أو كلمة المرور غير صحيحة"; break;
      case "auth/too-many-requests":
        message = "⚠️ محاولات كثيرة. حاول لاحقًا"; break;
      case "auth/invalid-email":
        message = "⚠️ البريد الإلكتروني غير صحيح"; break;
      case "auth/network-request-failed":
        message = "⚠️ تحقق من اتصال الإنترنت"; break;
    }
    if (errBox) { errBox.textContent = message; errBox.style.display = "block"; }
  }
}

async function doLogout() {
  if (!confirm("هل تريد تسجيل الخروج؟")) return;
  try { await signOut(auth); } catch (error) { console.error(error); toast("❌ فشل تسجيل الخروج", true); }
}

async function loadPersons() {
  if (!auth.currentUser) return;
  try {
    const snapshot = await getDocs(collection(db, "persons"));
    allPersons = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
    allPersons.sort((a, b) => String(a.code || "").localeCompare(String(b.code || ""), undefined, { numeric: true }));
    renderStats();
    renderTable();
  } catch (error) {
    console.error("Firestore load error:", error);
    let message = "❌ تعذر تحميل البيانات";
    if (error.code === "permission-denied") message = "❌ ليس لديك صلاحية للوصول إلى البيانات";
    toast(message, true);
  }
}

function renderStats() {
  const counts = { target: 0, ally: 0, adversary: 0, family: 0, telegram: 0 };
  allPersons.forEach(p => { if (Object.prototype.hasOwnProperty.call(counts, p.category)) counts[p.category]++; });
  const stats = $("stats"); if (!stats) return;
  stats.innerHTML = `
    <div class="stat"><div class="stat-value">${allPersons.length}</div><div class="stat-label">إجمالي</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--gold)">${counts.target}</div><div class="stat-label">أهداف</div></div>
    <div class="stat"><div class="stat-value">${counts.ally}</div><div class="stat-label">حلفاء</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--red)">${counts.adversary}</div><div class="stat-label">خصوم</div></div>
    <div class="stat"><div class="stat-value">${counts.family}</div><div class="stat-label">عائلة</div></div>
    <div class="stat"><div class="stat-value" style="color:#7c3aed">${counts.telegram}</div><div class="stat-label">تيليجرام</div></div>
  `;
}

function categoryLabel(c) { return { target:"🎯 هدف", ally:"🤝 حليف", adversary:"⚠️ خصم", family:"👨‍👩‍👧 عائلة", telegram:"💬 تيليجرام" }[c] || "غير محدد"; }
function statusLabel(s) { return { safe:"🟢 آمن", watch:"🟡 مراقبة", danger:"🔴 خطر", missing:"⚫ مفقود" }[s] || "غير محدد"; }

function renderTable() {
  const body = $("tableBody"); if (!body) return;
  const search = normalize($("adminSearch")?.value || "");
  const filtered = allPersons.filter(p => {
    const text = [p.code, p.name, p.name_ar].map(normalize).join(" ");
    return !search || text.includes(search);
  });
  if (!filtered.length) {
    body.innerHTML = `<tr><td colspan="5" class="empty-row">لا توجد نتائج</td></tr>`;
    return;
  }
  body.innerHTML = filtered.map(p => {
    const id = escapeHTML(p.id);
    return `
      <tr data-id="${id}">
        <td><span style="font-family:'JetBrains Mono',monospace; color:var(--accent);">${escapeHTML(p.code || "-")}</span></td>
        <td><strong>${escapeHTML(p.name || "-")}</strong><br><span style="color:var(--dim); font-size:0.75rem;">${escapeHTML(p.name_ar || "")}</span></td>
        <td>${escapeHTML(categoryLabel(p.category))}</td>
        <td>${escapeHTML(statusLabel(p.status))}</td>
        <td>
          <div class="row-actions">
            <button type="button" class="btn-mini btn-edit" data-action="edit" data-id="${id}">✏️ تعديل</button>
            <button type="button" class="btn-mini btn-del" data-action="delete" data-id="${id}">🗑️ حذف</button>
          </div>
        </td>
      </tr>`;
  }).join("");
}

function openForm(person = null) {
  if (person) {
    $("formTitle").textContent = "✏️ تعديل: " + (person.name || "");
    setValue("editId", person.id);
    setValue("f_code", person.code);
    setValue("f_category", person.category || "ally");
    setValue("f_name", person.name);
    setValue("f_name_ar", person.name_ar);
    setValue("f_status", person.status || "safe");
    setValue("f_threat_level", person.threat_level);
    setValue("f_role", person.role);
    setValue("f_age", person.age);
    setValue("f_dob", person.dob);
    setValue("f_birthplace", person.birthplace);
    setValue("f_nationality", person.nationality);
    setValue("f_education", person.education);
    setValue("f_marital", person.marital);
    setValue("f_image", person.image);
    setValue("f_phone", person.phone);
    setValue("f_carrier", person.carrier);
    setValue("f_telegram_id", person.telegram_id);
    setValue("f_telegram_user", person.telegram_user);
    setValue("f_email", person.email);
    setValue("f_twitter", person.twitter);
    setValue("f_addresses", person.addresses);
    setValue("f_psycho_analysis", person.psycho_analysis);
    setValue("f_behavior_pattern", person.behavior_pattern);
    setValue("f_weaknesses", person.weaknesses);
    setValue("f_strengths", person.strengths);
    setValue("f_notes", person.notes);
    setValue("f_secret_notes", person.secret_notes);
    setValue("f_secret_reports", person.secret_reports);
    setValue("f_secret_leaks", person.secret_leaks);
  } else {
    $("formTitle").textContent = "➕ إضافة شخص جديد";
    const modalBody = document.querySelector(".modal-body");
    if (modalBody) {
      modalBody.querySelectorAll("input, textarea, select").forEach(el => {
        if (el.type === "hidden") el.value = "";
        else if (el.tagName === "SELECT") el.selectedIndex = 0;
        else el.value = "";
      });
    }
  }
  $("formModal")?.classList.add("active");
}

function closeForm() { $("formModal")?.classList.remove("active"); }

function editPerson(id) {
  const person = allPersons.find(item => item.id === id);
  if (!person) { toast("❌ العنصر غير موجود", true); return; }
  openForm(person);
}

function getFormData() {
  return {
    code: value("f_code"), category: value("f_category"), name: value("f_name"),
    name_ar: value("f_name_ar"), status: value("f_status"), threat_level: value("f_threat_level"),
    role: value("f_role"), age: value("f_age"), dob: value("f_dob"), birthplace: value("f_birthplace"),
    nationality: value("f_nationality"), education: value("f_education"), marital: value("f_marital"),
    image: value("f_image"), phone: value("f_phone"), carrier: value("f_carrier"),
    telegram_id: value("f_telegram_id"), telegram_user: value("f_telegram_user"),
    email: value("f_email"), twitter: value("f_twitter"), addresses: value("f_addresses"),
    psycho_analysis: value("f_psycho_analysis"), behavior_pattern: value("f_behavior_pattern"),
    weaknesses: value("f_weaknesses"), strengths: value("f_strengths"), notes: value("f_notes"),
    secret_notes: value("f_secret_notes"), secret_reports: value("f_secret_reports"),
    secret_leaks: value("f_secret_leaks"), updatedAt: serverTimestamp()
  };
}

function generateNextCode() {
  const used = new Set();
  allPersons.forEach(p => {
    const m = String(p.code || "").match(/^SUBJ-(\d+)$/i);
    if (m) used.add(Number(m[1]));
  });
  let n = 1;
  while (used.has(n)) n++;
  return `SUBJ-${String(n).padStart(3, "0")}`;
}

function codeExists(code, currentId = "") {
  if (!code) return false;
  const nc = normalize(code);
  return allPersons.some(p => p.id !== currentId && normalize(p.code) === nc);
}

async function savePerson() {
  if (!auth.currentUser) { toast("❌ يجب تسجيل الدخول أولًا", true); return; }
  const data = getFormData();
  const editId = value("editId");
  if (!data.name) { toast("⚠️ الاسم مطلوب", true); return; }
  if (!validAge(data.age)) { toast("⚠️ السن يجب أن يكون رقمًا بين 0 و120", true); return; }
  if (!validEmail(data.email)) { toast("⚠️ البريد الإلكتروني غير صحيح", true); return; }
  if (!validURL(data.image)) { toast("⚠️ رابط الصورة غير صحيح", true); return; }
  if (!data.code) data.code = generateNextCode();
  if (codeExists(data.code, editId)) { toast("⚠️ هذا الكود مستخدم بالفعل", true); return; }
  try {
    if (editId) {
      await setDoc(doc(db, "persons", editId), data, { merge: true });
      toast("✓ تم التعديل بنجاح");
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, "persons"), data);
      toast("✓ تمت الإضافة بنجاح");
    }
    closeForm();
    await loadPersons();
  } catch (error) {
    console.error("Save error:", error);
    let message = "❌ حدث خطأ أثناء الحفظ";
    if (error.code === "permission-denied") message = "❌ ليس لديك صلاحية للحفظ";
    toast(message, true);
  }
}

async function deletePerson(id) {
  if (!auth.currentUser) { toast("❌ يجب تسجيل الدخول", true); return; }
  const person = allPersons.find(item => item.id === id);
  if (!person) { toast("❌ العنصر غير موجود", true); return; }
  const name = person.name || person.name_ar || "هذا العنصر";
  if (!confirm(`⚠️ هل أنت متأكد من حذف "${name}"؟\n\nلا يمكن التراجع عن هذه العملية.`)) return;
  try {
    await deleteDoc(doc(db, "persons", id));
    toast("✓ تم الحذف بنجاح");
    await loadPersons();
  } catch (error) {
    console.error("Delete error:", error);
    let message = "❌ حدث خطأ أثناء الحذف";
    if (error.code === "permission-denied") message = "❌ ليس لديك صلاحية للحذف";
    toast(message, true);
  }
}

/* Events */
$("loginBtn")?.addEventListener("click", doLogin);
$("logoutBtn")?.addEventListener("click", doLogout);
$("addBtn")?.addEventListener("click", () => openForm());
$("refreshBtn")?.addEventListener("click", loadPersons);
$("closeFormBtn")?.addEventListener("click", closeForm);
$("saveBtn")?.addEventListener("click", savePerson);
$("loginPass")?.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("adminSearch")?.addEventListener("input", renderTable);
$("tableBody")?.addEventListener("click", e => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  if (action === "edit") editPerson(id);
  if (action === "delete") deletePerson(id);
});
$("formModal")?.addEventListener("click", e => { if (e.target === $("formModal")) closeForm(); });

renderStats();
renderTable();
</script>

</body>
</html>
